<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>MatFlow</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: #0a0a0a;
        color: #f5f5f5;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      }
      .card {
        width: 100%;
        max-width: 420px;
        border-radius: 20px;
        background: rgba(255,255,255,0.06);
        border: 1px solid rgba(255,255,255,0.08);
        padding: 28px;
        text-align: center;
      }
      .icon { font-size: 44px; margin-bottom: 12px; }
      h1 { margin: 0 0 12px; font-size: 28px; }
      p { margin: 0; color: rgba(255,255,255,0.72); line-height: 1.55; }
      .button {
        display: inline-block;
        margin-top: 20px;
        width: 100%;
        padding: 14px 18px;
        border-radius: 12px;
        border: 0;
        background: #f5f5f5;
        color: #0a0a0a;
        font-size: 16px;
        font-weight: 700;
        cursor: pointer;
      }
      .subtext { margin-top: 14px; font-size: 13px; color: rgba(255,255,255,0.5); }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="icon" id="icon">🔁</div>
      <h1 id="title">Returning to the app…</h1>
      <p id="message">We’re sending you back to MatFlow now.</p>
      <button class="button" id="open-app">Open MatFlow</button>
      <p class="subtext">If the app does not open automatically, tap the button above.</p>
    </main>

    <script>
      const knownStatuses = new Set(['success', 'canceled', 'portal'])
      const rawStatus = new URLSearchParams(window.location.search).get('status')
      const status = knownStatuses.has(rawStatus) ? rawStatus : 'success'
      const copy = {
        success: {
          icon: '✅',
          title: 'Payment successful',
          message: 'Your subscription is being refreshed. We’ll bring you back into the app.',
        },
        canceled: {
          icon: '❌',
          title: 'Checkout canceled',
          message: 'No charge was made. You can return to the app and try again anytime.',
        },
        portal: {
          icon: '🧾',
          title: 'Returning from billing',
          message: 'We’re taking you back to MatFlow and refreshing your subscription details.',
        },
      }

      const view = copy[status]
      document.getElementById('icon').textContent = view.icon
      document.getElementById('title').textContent = view.title
      document.getElementById('message').textContent = view.message

      const deepLink = `matflow://billing/return?subscription=${status}`
      const openApp = () => { window.location.href = deepLink }

      document.getElementById('open-app').addEventListener('click', openApp)
      window.setTimeout(openApp, 450)
    </script>
  </body>
</html>
