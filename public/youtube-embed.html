<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="referrer" content="origin" />
    <title>MatFlow Video</title>
    <style>
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        background: #0a0a0a;
        color: #f5f5f5;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      }
      body { display: flex; align-items: center; justify-content: center; }
      .frame, .fallback {
        width: 100%;
        min-height: 100vh;
        border: 0;
      }
      .fallback {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        text-align: center;
      }
      a { color: #f5f5f5; }
    </style>
  </head>
  <body>
    <script>
      const params = new URLSearchParams(window.location.search)
      const videoId = params.get('videoId')
      const isValidVideoId = typeof videoId === 'string' && /^[A-Za-z0-9_-]{6,}$/.test(videoId)

      if (!isValidVideoId) {
        document.body.innerHTML = '<main class="fallback"><div><p>Video unavailable.</p></div></main>'
      } else {
        const iframe = document.createElement('iframe')
        iframe.className = 'frame'
        iframe.allow = 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share'
        iframe.allowFullscreen = true
        iframe.referrerPolicy = 'origin'
        iframe.title = 'MatFlow Video'
        iframe.src = `https://www.youtube-nocookie.com/embed/${encodeURIComponent(videoId)}?playsinline=1&rel=0&modestbranding=1`
        document.body.appendChild(iframe)
      }
    </script>
  </body>
</html>
